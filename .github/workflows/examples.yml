name: Examples

# Every example, against the packages as published on npm: on each push and pull request, and every Monday, so an
# example that a new release breaks is caught even when nothing here changed.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  example:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [kit/social-cards, kit/design-check, kit/typed-script, cli/build-a-design, cli/translate, runtime/expressions, runtime/site-backend]
    defaults:
      run:
        working-directory: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # The latest published versions, not a lockfile: this is a check that today's releases work.
      - run: npm install
      - run: npm test
